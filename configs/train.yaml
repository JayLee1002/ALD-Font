lightning:
  callbacks:
    image_logger:
      target: main.ImageLogger
      params:
        batch_frequency: 5000
        max_images: 8
        increase_log_steps: false
  modelcheckpoint:
    target: pytorch_lightning.callbacks.ModelCheckpoint
    params:
      every_n_epochs: 10
      save_top_k: -1
      save_last: true
  trainer:
    benchmark: true
    enable_progress_bar: false
    accelerator: ddp
    gpus: 0,

model:
  base_learning_rate: 8.0e-07
  target: ldm.models.diffusion.ald_font.ALDFont
  params:
    parameterization: x0
    linear_start: 0.00085
    linear_end: 0.012
    num_timesteps_cond: 1
    log_every_t: 30
    timesteps: 1000
    first_stage_key: image
    cond_stage_key: char_img
    image_size: 16
    channels: 4
    cond_stage_trainable: false
    conditioning_key: crossattn
    monitor: val/loss_simple_ema
    scale_factor: 0.18215
    use_ema: false
    ckpt_path: ../cache/v2-1_512-ema-pruned.ckpt
    unet_config:
      target: ldm.modules.diffusionmodules.openaimodel.UNetModel
      params:
        use_checkpoint: true
        use_fp16: false
        image_size: 16
        in_channels: 8
        out_channels: 4
        model_channels: 128
        attention_resolutions:
        - 2
        - 1
        - 1
        num_res_blocks: 2
        channel_mult:
        - 1
        - 1
        - 2
        - 2
        num_head_channels: 64
        use_spatial_transformer: true
        use_linear_in_transformer: true
        transformer_depth: 1
        context_dim: 768
        legacy: false
    first_stage_config:
      target: ldm.models.autoencoder.AutoencoderKL
      params:
        ckpt_path: ../cache/v2-1_512-ema-pruned.ckpt
        embed_dim: 4
        monitor: val/rec_loss
        ddconfig:
          double_z: true
          z_channels: 4
          resolution: 256
          in_channels: 3
          out_ch: 3
          ch: 128
          ch_mult:
          - 1
          - 2
          - 4
          - 4
          num_res_blocks: 2
          attn_resolutions: []
          dropout: 0.0
        lossconfig:
          target: torch.nn.Identity
    cond_stage_config: __is_first_stage__
    style_stage_config:
      target: ldm.modules.encoders.modules.ChineseCLIPEmbedder
      params:
        version: ../cache/chinese-vit-large-patch14
        freeze: true
        output_dim: 768
data:
  target: main.DataModuleFromConfig
  params:
    batch_size: 4
    num_workers: 4
    wrap: false
    train:
      target: ldm.data.ald_font.FontTTFTrain
      params:
        size: 128
        data_dirs: train_data/train_ttf
        train_chars: train_data/train_chars_eg.json
        source_path: train_data/simsun.ttf
    predict:
      target: ldm.data.ald_font.FontTTFPredict
      params:
        size: 128
        data_dirs: eval_data/eval_ttf
        train_chars: eval_data/eval_chars_eg.json
        ref_json_path: eval_data/ref_chars.json
        source_path: train_data/simsun.ttf
    finetune:
      target: ldm.data.ald_font.FontTTFTrain
      params:
        size: 128
        data_dirs: eval_data/eval_ttf
        train_chars: eval_data/eval_chars_eg.json
        source_path: train_data/simsun.ttf
        
